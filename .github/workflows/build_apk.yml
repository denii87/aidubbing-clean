name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Project Structure
        run: |
          mkdir temp_lib
          cp -r lib/* temp_lib/
          flutter create --org com.aidubbing.pro app_project
          cp -r temp_lib/* app_project/lib/
          cd app_project
          rm -rf test
          flutter pub add file_picker

      - name: Build APK
        run: |
          cd app_project
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app_project/build/app/outputs/flutter-apk/app-release.apk
